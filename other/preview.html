<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rules.js preview</title>
<style>
  body { margin: 0; padding: 16px; background: #2b2b2b; color: #ddd; font: 13px -apple-system, Arial, sans-serif; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 12px; }
  .controls label { display: flex; gap: 6px; align-items: center; }
  input[type=number] { width: 60px; }
  button { padding: 3px 10px; }
  #box { display: block; border: 1px solid #555; }
  #log { margin-top: 12px; white-space: pre; font: 11px Menlo, monospace; color: #aaa; max-height: 260px; overflow: auto; background: #1e1e1e; padding: 8px; }
  .note { color: #888; font-size: 12px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="note">Preview of <code>code/rules.js</code> outside Max: <code>mgraphics</code> is emulated with Canvas 2D, Max globals are stubbed. Reload the page after editing the script.</div>
<div class="controls">
  <label>seed <input id="seed" type="number" value="0"></label>
  <button id="randomize">randomize</button>
  <button id="derive">derive</button>
  <button id="bang">bang</button>
  <label>n_cohorts <input id="ncoh" type="range" min="1" max="64" value="1"> <span id="ncohv">1</span></label>
  <label>box <input id="bw" type="number" value="640"> × <input id="bh" type="number" value="420"></label>
  <button id="dump">dump selected</button>
</div>
<canvas id="box"></canvas>
<div id="log"></div>

<script>
// ---------- Max globals ----------
const logEl = document.getElementById('log');
function log(s) { logEl.textContent += s; logEl.scrollTop = logEl.scrollHeight; }
function post(...a) { log(a.join(' ')); }
function outlet(n, ...a) { log('outlet ' + n + ': ' + a.join(' ') + '\n'); }
function JitterMatrix(planecount, type, w, h) {
  this.planecount = planecount; this.type = type; this.dim = [w, h];
  this.name = 'u' + Math.floor(Math.random() * 1e9);
  this.copyarraytomatrix = (arr) => {
    if (arr.length !== planecount * w * h) throw new Error('copyarraytomatrix: size mismatch ' + arr.length);
  };
}

// ---------- mgraphics -> Canvas 2D ----------
const canvas = document.getElementById('box');
const ctx = canvas.getContext('2d');
let boxW = 640, boxH = 420, pending = false;
let font = 'Arial', fontSize = 10, cx = 0, cy = 0;

function applyFont() { ctx.font = fontSize + 'px ' + font; }

const mgraphics = {
  relative_coords: 0, autofill: 0,
  init() {},
  get size() { return [boxW, boxH]; },
  set_source_rgba(r, g, b, a) {
    const c = `rgba(${Math.round(r * 255)},${Math.round(g * 255)},${Math.round(b * 255)},${a === undefined ? 1 : a})`;
    ctx.fillStyle = c; ctx.strokeStyle = c;
  },
  rectangle(x, y, w, h) { ctx.rect(x, y, w, h); },
  move_to(x, y) { cx = x; cy = y; ctx.moveTo(x, y); },
  line_to(x, y) { cx = x; cy = y; ctx.lineTo(x, y); },
  fill() { ctx.fill(); ctx.beginPath(); },
  stroke() { ctx.stroke(); ctx.beginPath(); },
  set_line_width(w) { ctx.lineWidth = w; },
  select_font_face(f) { font = f; applyFont(); },
  set_font_size(s) { fontSize = s; applyFont(); },
  text_measure(t) { return [ctx.measureText(t).width, fontSize]; },
  show_text(t) { ctx.fillText(t, cx, cy); cx += ctx.measureText(t).width; ctx.beginPath(); },
  redraw() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => { pending = false; draw(); });
  },
};

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = boxW + 'px'; canvas.style.height = boxH + 'px';
  canvas.width = boxW * dpr; canvas.height = boxH * dpr;
}

function draw() {
  const dpr = window.devicePixelRatio || 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.textBaseline = 'alphabetic';
  ctx.beginPath();
  paint();
}
</script>

<!-- the real script, unmodified -->
<script src="../code/rules.js"></script>

<script>
resize();
loadbang();
draw();

// mouse -> onclick / ondrag (Max coordinates: box-relative pixels)
let down = false;
function pos(e) { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
canvas.addEventListener('mousedown', (e) => { down = true; onclick(...pos(e), 1); });
window.addEventListener('mousemove', (e) => { if (down) ondrag(...pos(e), 1); });
window.addEventListener('mouseup', (e) => { if (down) { down = false; ondrag(...pos(e), 0); } });

const $ = (id) => document.getElementById(id);
$('randomize').onclick = () => randomize(Number($('seed').value));
$('derive').onclick = () => derive(Number($('seed').value));
$('bang').onclick = () => bang();
$('dump').onclick = () => dump(selected_slot === 0 ? undefined : selected_slot - 1);
$('ncoh').oninput = (e) => { $('ncohv').textContent = e.target.value; n_cohorts(Number(e.target.value)); };
// ?n=8 sets n_cohorts on load
const n0 = Number(new URLSearchParams(location.search).get('n'));
if (n0) { $('ncoh').value = n0; $('ncohv').textContent = n0; n_cohorts(n0); }
function onBox() { boxW = Number($('bw').value); boxH = Number($('bh').value); resize(); onresize(boxW, boxH); }
$('bw').onchange = onBox; $('bh').onchange = onBox;
</script>
</body>
</html>
